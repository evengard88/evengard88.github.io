<!-- Native login form created dynamically to avoid Compose DOM interference -->
<script>
(function() {
    var overlay, form, emailInput, passwordInput, titleEl, submitBtn, toggleLink, forgotLink, closeBtn, errorDiv;
    var isCreate = false;
    var isForgot = false;
    var built = false;

    function buildForm() {
        if (built) return;
        built = true;

        overlay = document.createElement('div');
        overlay.id = 'nativeLoginOverlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;width:' + window.innerWidth + 'px;height:' + window.innerHeight + 'px;background:rgba(0,0,0,0.5);z-index:2147483647;display:none;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;';

        overlay.innerHTML =
            '<form id="nativeLoginForm" autocomplete="on" style="border-radius:16px;padding:24px;width:90%;max-width:400px;box-sizing:border-box;">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
                    '<h2 id="nativeLoginTitle" style="margin:0;font-size:18px;">Sign In</h2>' +
                    '<button type="button" id="nativeLoginClose" style="background:none;border:none;font-size:22px;cursor:pointer;color:#8e8e93;padding:4px 8px;">&times;</button>' +
                '</div>' +
                '<div id="nativeLoginError" style="display:none;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;text-align:center;"></div>' +
                '<input id="nativeLoginEmail" type="email" name="email" autocomplete="username" placeholder="Email" required ' +
                    'style="display:block;width:100%;padding:12px;margin-bottom:12px;border-radius:12px;font-size:16px;box-sizing:border-box;outline:none;">' +
                '<input id="nativeLoginPassword" type="password" name="password" autocomplete="current-password" placeholder="Password" required ' +
                    'style="display:block;width:100%;padding:12px;margin-bottom:16px;border-radius:12px;font-size:16px;box-sizing:border-box;outline:none;">' +
                '<button type="submit" id="nativeLoginSubmit" style="display:block;width:100%;padding:14px;background:#AF52DE;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;">Sign In</button>' +
                '<div style="display:flex;justify-content:space-between;margin-top:12px;">' +
                    '<a href="#" id="nativeLoginToggle" style="font-size:13px;color:#AF52DE;text-decoration:none;">No account? Create one</a>' +
                    '<a href="#" id="nativeLoginForgot" style="font-size:13px;color:#8e8e93;text-decoration:none;">Forgot password?</a>' +
                '</div>' +
            '</form>';

        document.documentElement.appendChild(overlay);

        form = overlay.querySelector('#nativeLoginForm');
        emailInput = overlay.querySelector('#nativeLoginEmail');
        passwordInput = overlay.querySelector('#nativeLoginPassword');
        titleEl = overlay.querySelector('#nativeLoginTitle');
        submitBtn = overlay.querySelector('#nativeLoginSubmit');
        toggleLink = overlay.querySelector('#nativeLoginToggle');
        forgotLink = overlay.querySelector('#nativeLoginForgot');
        closeBtn = overlay.querySelector('#nativeLoginClose');
        errorDiv = overlay.querySelector('#nativeLoginError');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var email = emailInput.value;
            if (isForgot) {
                if (email && window._nativeLoginOnForgotPassword) {
                    window._nativeLoginOnForgotPassword(email);
                    errorDiv.style.color = '#34C759';
                    errorDiv.style.background = 'transparent';
                    errorDiv.textContent = 'If an account exists for ' + email + ', a reset link has been sent. Check your inbox and spam folder.';
                    errorDiv.style.display = 'block';
                    setTimeout(function() { setForgotMode(false); }, 3000);
                }
                return;
            }
            var password = passwordInput.value;
            if (email && password) {
                if (isCreate && window._nativeLoginOnCreateAccount) {
                    window._nativeLoginOnCreateAccount(email, password);
                } else if (window._nativeLoginOnSubmit) {
                    window._nativeLoginOnSubmit(email, password);
                }
            }
        });

        toggleLink.addEventListener('click', function(e) {
            e.preventDefault();
            errorDiv.style.display = 'none';
            if (isForgot) {
                setForgotMode(false);
            } else {
                updateMode(!isCreate);
            }
        });

        forgotLink.addEventListener('click', function(e) {
            e.preventDefault();
            setForgotMode(true);
        });

        closeBtn.addEventListener('click', function() {
            window.hideNativeLoginForm();
            if (window._nativeLoginOnDismiss) window._nativeLoginOnDismiss();
        });

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                window.hideNativeLoginForm();
                if (window._nativeLoginOnDismiss) window._nativeLoginOnDismiss();
            }
        });
    }

    function setForgotMode(forgot) {
        isForgot = forgot;
        errorDiv.style.display = 'none';
        if (forgot) {
            titleEl.textContent = 'Reset Password';
            submitBtn.textContent = 'Send Reset Link';
            passwordInput.style.display = 'none';
            passwordInput.removeAttribute('required');
            forgotLink.style.display = 'none';
            toggleLink.textContent = 'Back to Sign In';
        } else {
            passwordInput.style.display = 'block';
            passwordInput.setAttribute('required', '');
            updateMode(isCreate);
        }
    }

    function updateMode(createMode) {
        isCreate = createMode;
        isForgot = false;
        titleEl.textContent = isCreate ? 'Create Account' : 'Sign In';
        submitBtn.textContent = isCreate ? 'Create Account' : 'Sign In';
        passwordInput.style.display = 'block';
        passwordInput.setAttribute('required', '');
        passwordInput.autocomplete = isCreate ? 'new-password' : 'current-password';
        toggleLink.textContent = isCreate ? 'Already have an account? Sign in' : 'No account? Create one';
        forgotLink.style.display = isCreate ? 'none' : '';
    }

    function applyTheme(isDark) {
        // Colors matching AppTheme.kt
        var bg = isDark ? '#2c2c2e' : '#fff';
        var textColor = isDark ? '#fff' : '#000';
        var inputBg = isDark ? '#1c1c1e' : '#fff';
        var inputColor = isDark ? '#fff' : '#000';
        var inputBorder = isDark ? '#48484a' : '#d1d1d6';
        var errBg = isDark ? '#3a1c1c' : '#ffe0e0';
        var errColor = isDark ? '#ff6b6b' : '#c00';
        var snake = isDark ? '#BF5AF2' : '#AF52DE';

        form.style.background = bg;
        titleEl.style.color = textColor;
        emailInput.style.background = inputBg;
        emailInput.style.color = inputColor;
        emailInput.style.border = '1px solid ' + inputBorder;
        passwordInput.style.background = inputBg;
        passwordInput.style.color = inputColor;
        passwordInput.style.border = '1px solid ' + inputBorder;
        errorDiv.style.background = errBg;
        errorDiv.style.color = errColor;
        submitBtn.style.background = snake;
        toggleLink.style.color = snake;
    }

    function setCanvasPointerEvents(enabled) {
        var canvas = document.querySelector('canvas');
        if (canvas) canvas.style.pointerEvents = enabled ? 'auto' : 'none';
    }

    window.showNativeLoginForm = function(mode, isDark) {
        buildForm();
        applyTheme(isDark);
        updateMode(mode === 'create');
        emailInput.value = '';
        passwordInput.value = '';
        errorDiv.style.display = 'none';
        overlay.style.display = 'flex';
        setCanvasPointerEvents(false);

        setTimeout(function() { emailInput.focus(); }, 50);
    };

    window.hideNativeLoginForm = function() {
        if (overlay) overlay.style.display = 'none';
        setCanvasPointerEvents(true);
    };

    window.showNativeLoginError = function(msg) {
        if (errorDiv) {
            errorDiv.textContent = msg;
            errorDiv.style.display = msg ? 'block' : 'none';
        }
    };

    window.hideNativeLoginError = function() {
        if (errorDiv) errorDiv.style.display = 'none';
    };
})();
</script>

<script>
    // Boot watchdog. The wasm is ~7 MB (~2 MB gzipped): on a slow connection the first load
    // takes well over 30s, and the old "hide loader after 30s regardless" fallback left a
    // silently blank page while the download was still in flight. Rules now:
    //  - the loader NEVER hides silently — only Kotlin's onAppReady hides it;
    //  - at 30s the subtitle switches to a "still loading" reassurance;
    //  - a fatal wasm error (stale CDN/SW asset mix right after a deploy → 404/compile fail)
    //    triggers ONE automatic reload per session, which refetches a consistent set;
    //  - otherwise (or if the retry already happened) the loader becomes an error screen
    //    with a Reload button and the error text, so failures are visible and reportable.
    (function() {
        var RETRY_KEY = 'sm_boot_retried';
        var loader = document.getElementById('loader');
        var failed = false;

        window._appReady = false;
        window._bootError = null;

        function isFatalBootError(msg) {
            return /webassembly|\.wasm|magic word|instantiat|http status|mime type|chunkloaderror|loading chunk|dynamically imported/i.test(msg || '');
        }

        function showBootError(msg) {
            if (window._appReady || failed || !loader.parentNode) return;
            failed = true;
            var subtitle = loader.querySelector('.loader-subtitle');
            var bar = loader.querySelector('.loader-bar-bg');
            if (bar) bar.style.display = 'none';
            if (subtitle) subtitle.textContent = 'The app failed to load. Check your connection and try again.';
            var btn = document.createElement('button');
            btn.textContent = 'Reload';
            btn.style.cssText = 'padding:12px 32px;background:#AF52DE;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;';
            btn.onclick = function() {
                try { sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
                location.reload();
            };
            loader.appendChild(btn);
            if (msg) {
                var err = document.createElement('p');
                err.textContent = String(msg).slice(0, 200);
                err.style.cssText = 'font-size:11px;color:#8e8e93;margin:16px 24px 0;max-width:420px;text-align:center;word-break:break-word;';
                loader.appendChild(err);
            }
        }

        window._bootFailed = function(msg) {
            if (window._appReady) return;
            var retried = false;
            try { retried = !!sessionStorage.getItem(RETRY_KEY); } catch (e) {}
            if (!retried && navigator.onLine !== false) {
                try { sessionStorage.setItem(RETRY_KEY, '1'); } catch (e) {}
                location.reload();
                return;
            }
            showBootError(msg);
        };

        window.addEventListener('error', function(e) {
            if (window._appReady) return;
            if (!window._bootError) window._bootError = e.message || 'unknown error';
            if (isFatalBootError(e.message)) window._bootFailed(e.message);
        });
        window.addEventListener('unhandledrejection', function(e) {
            if (window._appReady) return;
            var r = e.reason;
            var msg = (r && (r.message || String(r))) || 'unhandled rejection';
            if (!window._bootError) window._bootError = msg;
            if (isFatalBootError(msg)) window._bootFailed(msg);
        });

        // Slow-connection reassurance; then give up visibly (never a blank page). If the
        // download does finish later, onAppReady still hides the loader over the error UI.
        setTimeout(function() {
            if (!window._appReady && !failed) {
                var subtitle = loader.querySelector('.loader-subtitle');
                if (subtitle) subtitle.textContent = 'Still loading — slow connection…';
            }
        }, 30000);
        setTimeout(function() {
            if (!window._appReady) showBootError(window._bootError);
        }, 180000);
    })();
</script>
<script>
    // Real download progress. Gradle stamps the main wasm's hashed name + UNCOMPRESSED size
    // into the placeholders below (dist only — on the dev server they stay unstamped and this
    // whole block is a no-op, keeping the indeterminate bar). The prefetch counts streamed
    // bytes for the percent; the browser HTTP cache / service worker dedups the request when
    // composeApp.js fetches the same URL moments later — nothing downloads twice.
    (function() {
        var wasmUrl = '0c7a3ff214d646587a58.wasm';
        var wasmSize = parseInt('8642989', 10);
        if (!wasmUrl || wasmUrl.indexOf('%%') !== -1 || !(wasmSize > 0)) return;
        if (typeof fetch !== 'function' || typeof ReadableStream === 'undefined') return;

        var bar = document.querySelector('#loader .loader-bar-fill');
        var subtitle = document.querySelector('#loader .loader-subtitle');
        var baseText = subtitle ? subtitle.textContent : 'Loading app...';

        fetch(wasmUrl).then(function(resp) {
            if (!resp.ok || !resp.body) return;
            var reader = resp.body.getReader();
            var received = 0;
            if (bar) {
                bar.style.animation = 'none';
                bar.style.transition = 'width 0.2s ease';
                bar.style.width = '0%';
            }
            function step() {
                return reader.read().then(function(r) {
                    if (window._appReady) { reader.cancel(); return; }
                    if (r.done) {
                        if (bar) bar.style.width = '100%';
                        if (subtitle) subtitle.textContent = 'Starting…';
                        return;
                    }
                    received += r.value.length;
                    var pct = Math.min(100, Math.round(received / wasmSize * 100));
                    if (bar) bar.style.width = pct + '%';
                    if (subtitle) subtitle.textContent = baseText + ' ' + pct + '%';
                    return step();
                });
            }
            return step();
        }).catch(function() { /* prefetch failed — loader keeps the indeterminate animation */ });
    })();
</script>

<script>
    // Hide loader when Compose signals it's ready
    (function() {
        var loader = document.getElementById('loader');
        var hidden = false;

        function hideLoader() {
            if (hidden) return;
            hidden = true;
            loader.classList.add('fade-out');
            setTimeout(function() { loader.remove(); }, 500);
        }

        // Called from Kotlin via PlatformInfo.onAppReady()
        window._hideLoader = function() {
            window._appReady = true;
            try { sessionStorage.removeItem('sm_boot_retried'); } catch (e) {}
            hideLoader();

            // Initialize Telegram Web App after Compose is ready
            if (window._isTelegram) {
                var tg = window.Telegram.WebApp;

                // Expand to full screen
                tg.expand();
                tg.disableVerticalSwipes();

                // Tell Telegram we're ready
                tg.ready();

                // Handle back button
                tg.BackButton.onClick(function() {
                    // Let Kotlin handle navigation; if no modal open, close the app
                    if (window._onTelegramBack) {
                        window._onTelegramBack();
                    } else {
                        tg.close();
                    }
                });

                // Listen for theme changes
                tg.onEvent('themeChanged', function() {
                    var isDark = tg.colorScheme === 'dark';
                    localStorage.setItem('snake_measurer_theme', isDark ? 'DARK' : 'LIGHT');
                    // Notify Kotlin to update theme
                    if (window._onTelegramThemeChanged) {
                        window._onTelegramThemeChanged(isDark);
                    }
                });

                // Expose Telegram user data for Kotlin (read-once, cleared after access)
                var _tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user || null;
                var _tgInitData = tg.initData || '';
                window._getTelegramUser = function() { var u = _tgUser; return u; };
                window._getTelegramInitData = function() { var d = _tgInitData; _tgInitData = ''; return d; };
            }
        };

        // No time-based fallback here: the boot watchdog above owns the slow/failed paths.
        // Hiding the loader on a timer while the wasm is still downloading left a blank page.
    })();

    // Register Service Worker (skip in Telegram — not needed)
    if ('serviceWorker' in navigator && !window._isTelegram) {
        navigator.serviceWorker.register('sw.js').catch(function(e) {
            console.warn('SW registration failed:', e);
        });
    }

    // Load Firebase AFTER Canvas is ready (non-blocking)
    function loadFirebase() {
        var scripts = [
            'https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js',
            'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js',
            'https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js'
        ];
        var loaded = 0;

        function onAllLoaded() {
            var firebaseConfig = {
                apiKey: "AIzaSyARDge4x1EEv5W1jJ15QdO5OW2RLLHNLqc",
                authDomain: "snakemeasurer.firebaseapp.com",
                projectId: "snakemeasurer",
                storageBucket: "snakemeasurer.firebasestorage.app",
                messagingSenderId: "223904200399",
                appId: "1:223904200399:web:2e98ea1c1f3f9fa54069ba",
                measurementId: "G-L6SQPK4C0V"
            };
            window.firebaseApp = firebase.initializeApp(firebaseConfig);
            window.firebaseAnalytics = null;
            window._firebaseReady = true;

            // Initialize Auth immediately so it's ready for Kotlin
            window.firebaseAuth = firebase.auth();
            window.firebaseAuth.onAuthStateChanged(function(user) {
                window.currentFirebaseUser = user;
                // Notify Kotlin side about auth state change (session restore after page reload)
                if (typeof window._onAuthStateChangedKotlin === 'function') {
                    window._onAuthStateChangedKotlin(user);
                }
            });
            window._firebaseAuthReady = true;

            if (window._firebaseReadyResolve) window._firebaseReadyResolve();
        }

        // Load scripts sequentially (auth depends on app, analytics depends on app)
        function loadNext() {
            if (loaded >= scripts.length) { onAllLoaded(); return; }
            var s = document.createElement('script');
            s.src = scripts[loaded];
            s.onload = function() { loaded++; loadNext(); };
            s.onerror = function() { loaded++; loadNext(); };
            document.head.appendChild(s);
        }
        loadNext();
    }

    // Firebase ready promise (Kotlin interop can await this)
    window._firebaseReady = false;
    window._firebaseReadyPromise = new Promise(function(resolve) {
        window._firebaseReadyResolve = resolve;
    });

    // Firebase helper functions (safe to call before Firebase loads)
    window.initFirebaseAnalytics = function(enabled) {
        if (!window._firebaseReady) {
            window._firebaseReadyPromise.then(function() { window.initFirebaseAnalytics(enabled); });
            return;
        }
        if (enabled && !window.firebaseAnalytics) {
            window.firebaseAnalytics = firebase.analytics();
            // Distinguish Telegram Mini App vs regular web traffic
            firebase.analytics().setUserProperties({
                app_source: window._isTelegram ? 'telegram' : 'web'
            });
        }
    };
    window.trackFirebaseEvent = function(eventName, params) {
        if (window.firebaseAnalytics) window.firebaseAnalytics.logEvent(eventName, params);
    };
    window.trackFirebasePageView = function(pagePath) {
        if (window.firebaseAnalytics) window.firebaseAnalytics.logEvent('page_view', { page_path: pagePath });
    };

    // Start loading Firebase after a short delay (let app JS download take priority)
    setTimeout(loadFirebase, 100);

    // --- RevenueCat Web Billing ---
    window._rcInstance = null;
    window._rcReady = false;
    window._rcApiKey = 'YOUR_REVENUECAT_WEB_API_KEY'; // TODO: replace with real web API key

    window.rcConfigure = function(userId) {
        try {
            if (typeof Purchases === 'undefined') {
                console.warn('RevenueCat SDK not loaded');
                return false;
            }
            window._rcInstance = Purchases.Purchases.configure(window._rcApiKey, userId || null);
            window._rcReady = true;
            return true;
        } catch(e) {
            console.error('RevenueCat configure failed:', e);
            return false;
        }
    };

    window.rcGetCustomerInfo = function() {
        if (!window._rcInstance) return Promise.reject('RC not configured');
        return window._rcInstance.getCustomerInfo();
    };

    window.rcGetOfferings = function() {
        if (!window._rcInstance) return Promise.reject('RC not configured');
        return window._rcInstance.getOfferings();
    };

    window.rcPurchase = function(pkg) {
        if (!window._rcInstance) return Promise.reject('RC not configured');
        return window._rcInstance.purchase({ rcPackage: pkg });
    };

    window.rcRestorePurchases = function() {
        if (!window._rcInstance) return Promise.reject('RC not configured');
        return window._rcInstance.restorePurchases();
    };

    window.rcLogIn = function(userId) {
        if (!window._rcInstance) return Promise.reject('RC not configured');
        return window._rcInstance.logIn(userId);
    };

    window.rcLogOut = function() {
        if (!window._rcInstance) return Promise.reject('RC not configured');
        return window._rcInstance.logOut();
    };

    window.rcCheckEntitlement = function(customerInfo, entitlementId) {
        try {
            var ent = customerInfo.entitlements.active[entitlementId];
            return ent ? true : false;
        } catch(e) { return false; }
    };

    window.rcGetProductId = function(customerInfo, entitlementId) {
        try {
            var ent = customerInfo.entitlements.active[entitlementId];
            return ent ? (ent.productIdentifier || '') : '';
        } catch(e) { return ''; }
    };

    window.rcGetExpiration = function(customerInfo, entitlementId) {
        try {
            var ent = customerInfo.entitlements.active[entitlementId];
            if (ent && ent.expirationDate) return new Date(ent.expirationDate).getTime();
            return 0;
        } catch(e) { return 0; }
    };

    // CSS keyframes for the loading spinner shown before RC paywall renders.
    // Inject once on first paywall open (idempotent).
    window._rcInstallSpinnerStyles = function() {
        if (document.getElementById('rc-paywall-spinner-styles')) return;
        var style = document.createElement('style');
        style.id = 'rc-paywall-spinner-styles';
        style.textContent =
            '@keyframes rc-spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }' +
            '.rc-paywall-spinner { width:48px;height:48px;border:4px solid rgba(255,255,255,0.2);border-top-color:#FFD700;border-radius:50%;animation:rc-spin 0.9s linear infinite; }';
        document.head.appendChild(style);
    };

    // Present RC's hosted paywall in a fullscreen overlay. Shows a spinner
    // while RC paywall content loads. Resolves with
    // { success: bool, isPremium: bool, productId: string, expirationMs: number, dismissed: bool, error: string }.
    // Cleans up the DOM container regardless of outcome.
    window.rcPresentPaywall = function() {
        return new Promise(function(resolve) {
            if (!window._rcInstance) { resolve({ success: false, error: 'RC not configured' }); return; }
            try {
                window._rcInstallSpinnerStyles();

                // Tear down stale container if any
                var existing = document.getElementById('rc-paywall-container');
                if (existing) existing.remove();

                var container = document.createElement('div');
                container.id = 'rc-paywall-container';
                container.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;overflow:auto;';

                // Spinner shown while RC paywall content loads. Replaced by RC
                // when its DOM mounts; if RC fails before mount, we remove it.
                var spinner = document.createElement('div');
                spinner.className = 'rc-paywall-spinner';
                spinner.id = 'rc-paywall-spinner';
                container.appendChild(spinner);

                document.body.appendChild(container);

                var cleanup = function() {
                    var c = document.getElementById('rc-paywall-container');
                    if (c) c.remove();
                };

                window._rcInstance.presentPaywall({ htmlTarget: container })
                    .then(function(purchaseResult) {
                        cleanup();
                        try {
                            var ci = purchaseResult.customerInfo;
                            var isPremium = window.rcCheckEntitlement(ci, 'premium');
                            var productId = window.rcGetProductId(ci, 'premium');
                            var expMs = window.rcGetExpiration(ci, 'premium');
                            resolve({ success: true, isPremium: isPremium, productId: productId, expirationMs: expMs, dismissed: false });
                        } catch (parseErr) {
                            resolve({ success: true, isPremium: false, dismissed: false, error: parseErr && parseErr.message });
                        }
                    })
                    .catch(function(err) {
                        cleanup();
                        var msg = (err && err.message) || String(err) || 'unknown';
                        var dismissed = /cancel|close|dismiss|user_cancel/i.test(msg);
                        resolve({ success: false, dismissed: dismissed, error: msg });
                    });
            } catch (e) {
                var c2 = document.getElementById('rc-paywall-container');
                if (c2) c2.remove();
                resolve({ success: false, error: (e && e.message) || 'rcPresentPaywall threw' });
            }
        });
    };
</script>
