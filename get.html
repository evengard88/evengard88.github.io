<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Get Snake Measurer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        // Smart redirect: send the visitor to the right store for their device.
        (function () {
            var ua = navigator.userAgent || navigator.vendor || '';
            var APPSTORE = 'https://apps.apple.com/app/snake-measurer/id6760619393';
            var PLAY = 'https://play.google.com/store/apps/details?id=app.serpwidgets.snakemeasurer';
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) location.replace(APPSTORE);
            else if (/android/i.test(ua)) location.replace(PLAY);
            else location.replace('/');   // desktop / other → landing page
        })();
    </script>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000; color: #fff; text-align: center; padding: 24px; }
        a { color: #BF5AF2; font-weight: 600; }
        .stores a { display: inline-block; margin: 0 8px; }
    </style>
</head>
<body>
    <p>Opening Snake Measurer…</p>
    <div class="stores">
        <a href="https://apps.apple.com/app/snake-measurer/id6760619393">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=app.serpwidgets.snakemeasurer">Google Play</a>
    </div>
    <p><a href="/">Open the web app</a></p>
</body>
</html>
